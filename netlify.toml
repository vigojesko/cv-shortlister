[build]
  command = "npm run build:netlify"
  publish = ".next"
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma/client"]
  included_files = ["node_modules/.prisma/client/**"]
[[plugins]]
  package = "@netlify/plugin-nextjs"
